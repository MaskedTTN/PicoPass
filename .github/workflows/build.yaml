name: Build SW image

on:
  push:  # Runs on every push to any branch

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PICO_SDK_FETCH_FROM_GIT: "TRUE"

    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake gcc-arm-none-eabi build-essential
          
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create build directory
        working-directory: ./PicoPassSW
        run: mkdir build

      - name: Run CMake
        working-directory: ./PicoPassSW/build
        run: cmake ..

      - name: Build with make
        working-directory: ./PicoPassSW/build
        run: make

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: test.uf2
          path: PicoPassSW/build/test.uf2

